# 웹(star2day.com) 자동 배포 — test 브랜치에 프론트 변경이 합쳐지면 빌드해서 Cloudflare Workers(star2day-web)에 올린다.
# 설정은 저장소 루트의 wrangler.jsonc 를 그대로 쓴다(이름 star2day-web, 결과 폴더 frontend/dist).
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare star2day-web → Settings → "API token for external CI/CD"에서 만든 토큰
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
# 수동 실행: GitHub → Actions → "Deploy web" → Run workflow
name: Deploy web (Cloudflare Workers)

on:
  push:
    branches: [test]
    paths:
      - 'frontend/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# 연달아 푸시되면 마지막 것만 배포한다.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (expo export -p web)
        working-directory: frontend
        env:
          # 구글 로그인 클라이언트 ID: 웹 화면에 그대로 포함되는 공개용 값(비밀 아님).
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 579922838252-groi7p318klcosj8vmq792rsb7t2vpdf.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 579922838252-0l696jtktcm059utc15t5dbef63ujueq.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 579922838252-t7t6rk3v3llv4tggfsjp349plspo0tkm.apps.googleusercontent.com
          # 서버 주소는 코드 기본값(https://api.star2day.com)을 쓴다.
        run: npx expo export -p web

      - name: Deploy to Cloudflare Workers (star2day-web)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 deploy
