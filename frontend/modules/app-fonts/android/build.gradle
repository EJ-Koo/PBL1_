plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appfonts'
version = '1.0.0'

android {
  namespace 'expo.modules.appfonts'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets.main.assets.srcDir('../../../assets/fonts')
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
